[env:esp32-c3]
platform      = espressif32
board         = esp32-c3-devkitm-1
framework     = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -O2
    -ffast-math          ; ESP32-C3 is RISC-V with NO hardware FPU: all float
                         ; math is soft-float, so give the compiler some room.
